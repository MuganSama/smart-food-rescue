<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Food Rescue - Multi-Role React & Tailwind CSS Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin
    src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- React Router v6.3.0 CDN (Stable UMD Build) -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/history@5.3.0/umd/history.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-router@6.3.0/umd/react-router.production.min.js"></script>
  <script crossorigin
    src="https://cdn.jsdelivr.net/npm/react-router-dom@6.3.0/umd/react-router-dom.production.min.js"></script>
  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Babel Standalone JSX compiler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <div id="root"></div>

  <!-- Client App Bootstrapper -->
  <script type="text/babel">
    const { HashRouter, Routes, Route, Link, useNavigate, useLocation, Navigate } = ReactRouterDOM;
    const { useState, useEffect, useContext, createContext } = React;

    // --- 1. DATA LAYER & MOCK STORAGE (src/supabase.js) ---
    const STORAGE_KEYS = {
      DONATIONS: 'sfr_react_donations',
      CITIZEN_REPORTS: 'sfr_react_reports',
      SESSION: 'sfr_react_session'
    };

    function seedInitialStorage() {
      if (!localStorage.getItem(STORAGE_KEYS.DONATIONS)) {
        const initialDonations = [
          {
            id: "don-101",
            donor_id: "usr-donor-1",
            donor_name: "Green Olive Bistro",
            title: "Gourmet Pasta & Organic Caesar Salads",
            category: "Prepared Meals",
            quantity: "60 meals",
            quantity_num: 60,
            expiry_time: new Date(Date.now() + 3 * 3600 * 1000).toISOString(),
            address: "128 Olive Garden Way, Midtown",
            lat: 40.7589,
            lng: -73.9851,
            storage_requirements: "Refrigerated",
            dietary_tags: ["Vegetarian", "Nut-Free"],
            status: "available",
            claimed_by_id: null,
            claimed_by_name: null,
            pickup_pin: null,
            notes: "Individually portioned containers packed hot.",
            created_at: new Date(Date.now() - 3600 * 1000).toISOString()
          },
          {
            id: "don-102",
            donor_id: "usr-donor-2",
            donor_name: "Artisan Bakery Co.",
            title: "Fresh Baked Sourdough & Croissants",
            category: "Bakery",
            quantity: "45 items",
            quantity_num: 45,
            expiry_time: new Date(Date.now() + 5 * 3600 * 1000).toISOString(),
            address: "742 Evergreen Terrace, Downtown",
            lat: 40.7128,
            lng: -74.0060,
            storage_requirements: "Room Temp",
            dietary_tags: ["Vegetarian"],
            status: "available",
            claimed_by_id: null,
            claimed_by_name: null,
            pickup_pin: null,
            notes: "Freshly baked morning batch.",
            created_at: new Date(Date.now() - 2 * 3600 * 1000).toISOString()
          }
        ];
        localStorage.setItem(STORAGE_KEYS.DONATIONS, JSON.stringify(initialDonations));
      }

      if (!localStorage.getItem(STORAGE_KEYS.CITIZEN_REPORTS)) {
        const initialReports = [
          {
            id: "rep-201",
            reporter_id: "usr-citizen-1",
            reporter_name: "Sarah Jenkins (Citizen Spotter)",
            location: "4th Street & Main Avenue Transit Plaza",
            lat: 40.7306,
            lng: -73.9921,
            est_people: 45,
            urgency: "High",
            category: "Street Community",
            description: "Group of unhoused community members gathered near the north pavilion needing dinner meal boxes.",
            status: "pending",
            serviced_by: null,
            created_at: new Date(Date.now() - 4 * 3600 * 1000).toISOString()
          },
          {
            id: "rep-202",
            reporter_id: "usr-citizen-2",
            reporter_name: "David Kim (Community Volunteer)",
            location: "Pier 12 Temporary Camp",
            lat: 40.7061,
            lng: -74.0089,
            est_people: 30,
            urgency: "Emergency",
            category: "Temporary Shelter",
            description: "Displaced family group needing bottled water and warm packaged soups.",
            status: "pending",
            serviced_by: null,
            created_at: new Date(Date.now() - 6 * 3600 * 1000).toISOString()
          }
        ];
        localStorage.setItem(STORAGE_KEYS.CITIZEN_REPORTS, JSON.stringify(initialReports));
      }
    }

    seedInitialStorage();

    const dbClient = {
      async getDonations() {
        const list = JSON.parse(localStorage.getItem(STORAGE_KEYS.DONATIONS)) || [];
        const baseCoords = [
          { lat: 40.7589, lng: -73.9851 }, // Midtown
          { lat: 40.7128, lng: -74.0060 }, // Downtown
          { lat: 40.7484, lng: -73.9857 }, // Empire State area
          { lat: 40.7291, lng: -73.9965 }  // Washington Square
        ];
        return list.map((item, idx) => ({
          ...item,
          lat: item.lat || baseCoords[idx % baseCoords.length].lat,
          lng: item.lng || baseCoords[idx % baseCoords.length].lng
        }));
      },
      async createDonation(donationData) {
        const list = await this.getDonations();
        const baseCoords = [
          { lat: 40.7589, lng: -73.9851 },
          { lat: 40.7128, lng: -74.0060 },
          { lat: 40.7484, lng: -73.9857 },
          { lat: 40.7291, lng: -73.9965 }
        ];
        const fixedCoord = baseCoords[list.length % baseCoords.length];
        const newRecord = {
          id: `don-${Math.floor(1000 + Math.random() * 9000)}`,
          status: 'available',
          created_at: new Date().toISOString(),
          lat: donationData.lat || fixedCoord.lat,
          lng: donationData.lng || fixedCoord.lng,
          ...donationData
        };
        list.unshift(newRecord);
        localStorage.setItem(STORAGE_KEYS.DONATIONS, JSON.stringify(list));
        return newRecord;
      },
      async claimDonation(donationId, ngoProfile) {
        const list = await this.getDonations();
        const item = list.find(d => d.id === donationId);
        if (item) {
          item.status = 'claimed';
          item.claimed_by_id = ngoProfile.id;
          item.claimed_by_name = ngoProfile.organization_name || ngoProfile.full_name;
          item.pickup_pin = Math.floor(1000 + Math.random() * 9000).toString();
          localStorage.setItem(STORAGE_KEYS.DONATIONS, JSON.stringify(list));
        }
        return item;
      },
      async verifyDonationPin(donationId, inputPin) {
        const list = await this.getDonations();
        const item = list.find(d => d.id === donationId);
        if (item && item.pickup_pin === inputPin) {
          item.status = 'completed';
          localStorage.setItem(STORAGE_KEYS.DONATIONS, JSON.stringify(list));
          return { success: true, item };
        }
        return { success: false, error: "Invalid PIN code" };
      },
      async getCitizenReports() {
        const list = JSON.parse(localStorage.getItem(STORAGE_KEYS.CITIZEN_REPORTS)) || [];
        const baseSpotterCoords = [
          { lat: 40.7306, lng: -73.9921 }, // Transit Plaza
          { lat: 40.7061, lng: -74.0089 }, // Pier 12
          { lat: 40.7505, lng: -73.9934 }, // Penn Station Plaza
          { lat: 40.7180, lng: -73.9880 }  // Essex Market
        ];
        return list.map((item, idx) => ({
          ...item,
          lat: item.lat || baseSpotterCoords[idx % baseSpotterCoords.length].lat,
          lng: item.lng || baseSpotterCoords[idx % baseSpotterCoords.length].lng
        }));
      },
      async createCitizenReport(reportData) {
        const list = await this.getCitizenReports();
        const baseSpotterCoords = [
          { lat: 40.7306, lng: -73.9921 },
          { lat: 40.7061, lng: -74.0089 },
          { lat: 40.7505, lng: -73.9934 },
          { lat: 40.7180, lng: -73.9880 }
        ];
        const fixedCoord = baseSpotterCoords[list.length % baseSpotterCoords.length];
        const newRecord = {
          id: `rep-${Math.floor(1000 + Math.random() * 9000)}`,
          status: 'pending',
          created_at: new Date().toISOString(),
          lat: reportData.lat || fixedCoord.lat,
          lng: reportData.lng || fixedCoord.lng,
          ...reportData
        };
        list.unshift(newRecord);
        localStorage.setItem(STORAGE_KEYS.CITIZEN_REPORTS, JSON.stringify(list));
        return newRecord;
      },
      async dispatchReport(reportId, ngoName) {
        const list = await this.getCitizenReports();
        const item = list.find(r => r.id === reportId);
        if (item) {
          item.status = 'dispatched';
          item.serviced_by = ngoName;
          localStorage.setItem(STORAGE_KEYS.CITIZEN_REPORTS, JSON.stringify(list));
        }
        return item;
      }
    };

    // --- 2. AUTHENTICATION CONTEXT (src/context/AuthContext.jsx) ---
    /**
     * FIRST-PRINCIPLES REASONING: Authentication Context
     * 1. WHY CONTEXT? Ensures single source of truth for user session & RLS role across the React tree.
     * 2. WHY DEMO PROFILES? Allows instant interactive validation of OAuth & Role-based routes.
     */
    const AuthContext = createContext(null);

    const PRESET_DEMO_PROFILES = {
      donor: {
        id: "usr-donor-101",
        email: "elena@greenolivebistro.com",
        full_name: "Elena Vance",
        organization_name: "Green Olive Bistro",
        role: "donor",
        avatar_url: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=200&q=80",
        phone: "+1 (555) 345-6789"
      },
      ngo: {
        id: "usr-ngo-102",
        email: "marcus@hopekitchen.org",
        full_name: "Marcus Brody",
        organization_name: "Hope Community Kitchen",
        role: "ngo",
        avatar_url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
        phone: "+1 (555) 901-2345"
      },
      citizen: {
        id: "usr-citizen-103",
        email: "sarah.j@citizennet.org",
        full_name: "Sarah Jenkins",
        organization_name: "Citizen Need Spotter",
        role: "citizen",
        avatar_url: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80",
        phone: "+1 (555) 123-9876"
      }
    };

    const AuthProvider = ({ children }) => {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('sfr_auth_session');
        return saved ? JSON.parse(saved) : null;
      });

      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (user) {
          localStorage.setItem('sfr_auth_session', JSON.stringify(user));
        } else {
          localStorage.removeItem('sfr_auth_session');
        }
      }, [user]);

      const loginWithGoogle = async (targetRole) => {
        setLoading(true);
        sessionStorage.setItem('sfr_oauth_target_role', targetRole);

        await new Promise(resolve => setTimeout(resolve, 500));

        const demoTemplate = PRESET_DEMO_PROFILES[targetRole] || PRESET_DEMO_PROFILES.donor;
        const authenticatedUser = {
          ...demoTemplate,
          role: targetRole,
          lastLogin: new Date().toISOString()
        };

        setUser(authenticatedUser);
        setLoading(false);
        return authenticatedUser;
      };

      const registerUser = async (formData) => {
        setLoading(true);
        await new Promise(resolve => setTimeout(resolve, 400));
        const newAccount = {
          id: `usr-${formData.role}-${Math.floor(1000 + Math.random() * 9000)}`,
          email: formData.email,
          password: formData.password || "password123",
          full_name: formData.full_name,
          organization_name: formData.organization_name || formData.full_name,
          role: formData.role,
          avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(formData.full_name)}`,
          created_at: new Date().toISOString()
        };

        const existingAccounts = JSON.parse(localStorage.getItem('sfr_registered_accounts')) || [];
        existingAccounts.push(newAccount);
        localStorage.setItem('sfr_registered_accounts', JSON.stringify(existingAccounts));

        setUser(newAccount);
        setLoading(false);
        return { success: true, user: newAccount };
      };

      const loginWithEmail = async (email, password) => {
        setLoading(true);
        await new Promise(resolve => setTimeout(resolve, 400));

        const existingAccounts = JSON.parse(localStorage.getItem('sfr_registered_accounts')) || [];
        const found = existingAccounts.find(acc => acc.email.toLowerCase() === email.toLowerCase());

        if (found) {
          if (found.password === password) {
            setUser(found);
            setLoading(false);
            return { success: true, user: found };
          } else {
            setLoading(false);
            return { success: false, error: "Incorrect password" };
          }
        }

        const presetValues = Object.values(PRESET_DEMO_PROFILES);
        const presetMatch = presetValues.find(p => p.email.toLowerCase() === email.toLowerCase());
        if (presetMatch) {
          setUser(presetMatch);
          setLoading(false);
          return { success: true, user: presetMatch };
        }

        setLoading(false);
        return { success: false, error: "Account not found. Please register a new account!" };
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem('sfr_auth_session');
        sessionStorage.removeItem('sfr_oauth_target_role');
      };

      return (
        <AuthContext.Provider value={{ user, loading, loginWithGoogle, loginWithEmail, registerUser, logout }}>
          {children}
        </AuthContext.Provider>
      );
    };

    const useAuth = () => useContext(AuthContext);

    // --- 3. PROTECTED ROUTE GUARD (src/components/ProtectedRoute.jsx) ---
    /**
     * FIRST-PRINCIPLES REASONING: Protected Route Guard
     * Checks 2 levels:
     * Level 1 (Auth check): Redirect unauthenticated users to role login route.
     * Level 2 (Role check): Redirect authorized users to their correct dashboard if attempting wrong route.
     */
    const ProtectedRoute = ({ children, allowedRole }) => {
      const { user, loading } = useAuth();

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="animate-spin rounded-full h-12 w-12 border-4 border-emerald-600 border-t-transparent"></div>
          </div>
        );
      }

      if (!user) {
        const loginRedirects = {
          donor: '/login-donor',
          ngo: '/login-ngo',
          citizen: '/login-citizen'
        };
        return <Navigate to={loginRedirects[allowedRole] || '/login-donor'} replace />;
      }

      if (user.role !== allowedRole) {
        const roleDashboards = {
          donor: '/donor',
          ngo: '/ngo',
          citizen: '/citizen'
        };
        return <Navigate to={roleDashboards[user.role] || '/'} replace />;
      }

      return children;
    };

    // --- 4. UNIVERSAL NAVBAR (src/components/Navbar.jsx) ---
    const Navbar = () => {
      const { user, logout } = useAuth();
      const navigate = useNavigate();
      const location = useLocation();

      const handleLogout = () => {
        logout();
        navigate('/');
      };

      return (
        <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-emerald-100 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <Link to="/" className="flex items-center gap-3 font-extrabold text-xl text-slate-900 group">
              <div className="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 text-white rounded-xl flex items-center justify-center shadow-md shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                🌱
              </div>
              <span>Smart<span className="text-emerald-600">Food</span>Rescue</span>
            </Link>

            <div className="hidden md:flex items-center gap-2">
              <Link
                to="/"
                className={`px-4 py-2 rounded-lg font-semibold text-sm transition-colors ${location.pathname === '/' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:text-emerald-600 hover:bg-slate-50'}`}
              >
                🌍 Global Impact
              </Link>

              {user && (
                <Link
                  to={`/${user.role}`}
                  className="px-4 py-2 rounded-lg font-semibold text-sm bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition-colors capitalize"
                >
                  📊 {user.role} Dashboard
                </Link>
              )}
            </div>

            <div className="flex items-center gap-4">
              {user ? (
                <div className="flex items-center gap-3 bg-slate-50 border border-slate-200 p-1.5 pr-3 rounded-full">
                  <img
                    src={user.avatar_url}
                    alt={user.full_name}
                    className="w-9 h-9 rounded-full object-cover border-2 border-emerald-500"
                  />
                  <div className="hidden sm:flex flex-col text-left">
                    <span className="text-xs font-bold text-slate-800 leading-tight">{user.full_name}</span>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-700">{user.role}</span>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="ml-2 px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-full font-bold text-xs transition-colors"
                  >
                    Logout
                  </button>
                </div>
              ) : (
                <div className="flex items-center gap-2">
                  <Link to="/login-donor" className="px-3.5 py-2 text-xs font-bold text-slate-700 hover:text-emerald-700 hover:bg-emerald-50 rounded-lg">Donor Login</Link>
                  <Link to="/login-ngo" className="px-3.5 py-2 text-xs font-bold text-slate-700 hover:text-emerald-700 hover:bg-emerald-50 rounded-lg">NGO Login</Link>
                  <Link to="/login-citizen" className="px-4 py-2 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow-sm">Spotter Login</Link>
                </div>
              )}
            </div>
          </div>
        </nav>
      );
    };

    // --- 4.5 LIVE GIS RESCUE MAP (Leaflet.js) ---
    const LiveRescueMap = ({ donations = [], reports = [], height = "450px" }) => {
      const mapRef = React.useRef(null);
      const containerRef = React.useRef(null);

      useEffect(() => {
        if (!containerRef.current || typeof L === 'undefined') return;

        if (!mapRef.current) {
          mapRef.current = L.map(containerRef.current).setView([40.7306, -73.9921], 12);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(mapRef.current);
        }

        const map = mapRef.current;

        // Force recalculation of map viewport size
        setTimeout(() => {
          if (map) map.invalidateSize();
        }, 250);

        // Clear existing markers
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });

        const bounds = [];

        // Only show active surplus food donations (remove once completed via PIN verification)
        const activeDonations = donations.filter(d => d.status !== 'completed');

        // Only show pending hunger spot alerts (remove once dispatched by NGO)
        const activeReports = reports.filter(r => r.status !== 'dispatched' && r.status !== 'completed' && r.status !== 'resolved');

        // Add active donation markers (Green)
        activeDonations.forEach(d => {
          if (d.lat && d.lng) {
            bounds.push([d.lat, d.lng]);
            const greenIcon = L.divIcon({
              className: 'custom-map-icon',
              html: `<div style="background-color: #10b981; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 11px; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap; font-family: sans-serif;">🍲 ${d.donor_name} (${d.quantity})</div>`,
              iconSize: [140, 32],
              iconAnchor: [70, 16]
            });
            const marker = L.marker([d.lat, d.lng], { icon: greenIcon }).addTo(map);
            marker.bindPopup(`
              <div style="font-family: sans-serif; padding: 6px; min-width: 180px;">
                <span style="background-color: #ecfdf5; color: #047857; font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase;">Surplus Food</span>
                <h4 style="color: #0f172a; font-size: 14px; font-weight: 800; margin: 4px 0 2px 0;">${d.title}</h4>
                <div style="font-size: 11px; color: #475569; margin-bottom: 2px;"><b>Donor:</b> ${d.donor_name}</div>
                <div style="font-size: 11px; color: #475569;"><b>Qty:</b> ${d.quantity}</div>
                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">📍 ${d.address}</div>
                <div style="margin-top: 8px; font-size: 10px; font-weight: bold; color: #059669; text-transform: uppercase;">Status: ${d.status}</div>
              </div>
            `);
          }
        });

        // Add active citizen hunger report markers (Red)
        activeReports.forEach(r => {
          if (r.lat && r.lng) {
            bounds.push([r.lat, r.lng]);
            const redIcon = L.divIcon({
              className: 'custom-map-icon',
              html: `<div style="background-color: #ef4444; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 11px; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); white-space: nowrap; font-family: sans-serif;">📍 Hunger Spot (~${r.est_people})</div>`,
              iconSize: [150, 32],
              iconAnchor: [75, 16]
            });
            const marker = L.marker([r.lat, r.lng], { icon: redIcon }).addTo(map);
            marker.bindPopup(`
              <div style="font-family: sans-serif; padding: 6px; min-width: 180px;">
                <span style="background-color: #fef2f2; color: #b91c1c; font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase;">Urgent Spotter Alert</span>
                <h4 style="color: #0f172a; font-size: 14px; font-weight: 800; margin: 4px 0 2px 0;">📍 ${r.location}</h4>
                <div style="font-size: 11px; color: #b91c1c; font-weight: bold;">Est. People: ~${r.est_people} (${r.urgency} Urgency)</div>
                <p style="font-size: 11px; color: #475569; margin: 4px 0;">${r.description}</p>
                <div style="margin-top: 6px; font-size: 10px; font-weight: bold; color: #dc2626; text-transform: uppercase;">Status: ${r.status}</div>
              </div>
            `);
          }
        });

        // Fit map view around all markers if available
        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [60, 60], maxZoom: 13 });

    // --- 4.6 INTERACTIVE LOCATION PICKER MAP ---
    const LocationPickerMap = ({ initialLat = 40.7306, initialLng = -73.9921, onLocationSelect, height = "220px", label = "Click anywhere on map to pin location" }) => {
      const mapRef = React.useRef(null);
      const markerRef = React.useRef(null);
      const containerRef = React.useRef(null);
      const [coords, setCoords] = React.useState({ lat: initialLat, lng: initialLng });

      useEffect(() => {
        if (!containerRef.current || typeof L === 'undefined') return;

        if (!mapRef.current) {
          const map = L.map(containerRef.current).setView([coords.lat, coords.lng], 13);
          mapRef.current = map;

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          const pinIcon = L.divIcon({
            className: 'custom-map-icon',
            html: `<div style="background-color: #2563eb; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 11px; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); white-space: nowrap; font-family: sans-serif;">🎯 Selected Location</div>`,
            iconSize: [140, 32],
            iconAnchor: [70, 16]
          });

          const marker = L.marker([coords.lat, coords.lng], { icon: pinIcon, draggable: true }).addTo(map);
          markerRef.current = marker;

          map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            const newLat = parseFloat(lat.toFixed(5));
            const newLng = parseFloat(lng.toFixed(5));
            setCoords({ lat: newLat, lng: newLng });
            marker.setLatLng([newLat, newLng]);
            if (onLocationSelect) onLocationSelect({ lat: newLat, lng: newLng });
          });

          marker.on('dragend', () => {
            const position = marker.getLatLng();
            const newLat = parseFloat(position.lat.toFixed(5));
            const newLng = parseFloat(position.lng.toFixed(5));
            setCoords({ lat: newLat, lng: newLng });
            if (onLocationSelect) onLocationSelect({ lat: newLat, lng: newLng });
          });
        }

        setTimeout(() => {
          if (mapRef.current) mapRef.current.invalidateSize();
        }, 300);
      }, []);

      return (
        <div className="space-y-1.5">
          <div className="flex justify-between items-center text-xs text-slate-600 font-bold">
            <span>📍 {label}</span>
            <span className="text-blue-600 font-mono text-[11px] bg-blue-50 px-2 py-0.5 rounded-md">
              {coords.lat}, {coords.lng}
            </span>
          </div>
          <div className="w-full bg-slate-100 rounded-2xl overflow-hidden border border-slate-300 shadow-sm relative" style={{ height }}>
            <div ref={containerRef} className="w-full h-full cursor-pointer" />
          </div>
        </div>
      );
    };

              <LocationPickerMap
                initialLat={donationCoords.lat}
                initialLng={donationCoords.lng}
                onLocationSelect={setDonationCoords}
                label="Pin Restaurant / Pickup Location on Map"
                height="220px"
              />

              <button type="submit" className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-colors">
                Publish Food Donation
              </button>
            </form>
          </div>

          {/* LISTINGS & HANDSHAKE VERIFICATION */}
          <div className="space-y-4">
            <h2 className="text-xl font-bold text-slate-900">My Active & Completed Listings ({myDonations.length})</h2>
            {myDonations.length === 0 ? (
              <div className="bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center text-slate-500 font-semibold text-sm">
                No surplus listings posted under your account yet. Post your first donation above!
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {myDonations.map(item => (
                  <div key={item.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">{item.category}</span>
                      <span className={`text-xs font-extrabold px-3 py-1 rounded-full capitalize ${item.status === 'completed' ? 'bg-slate-100 text-slate-700' : item.status === 'claimed' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                        {item.status === 'claimed' ? '⚡ Claimed by NGO' : item.status}
                      </span>
                    </div>

                    <div>
                      <h3 className="font-bold text-slate-900 text-base">{item.title}</h3>
                      <div className="text-xs text-slate-500 mt-1">Quantity: {item.quantity} | {item.address}</div>
                    </div>

                    {/* PIN HANDSHAKE INPUT IF CLAIMED */}
                    {item.status === 'claimed' && (
                      <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl space-y-3">
                        <div className="text-xs font-bold text-amber-900">
                          🔒 Driver Handshake PIN Verification:
                        </div>
                        <div className="text-[11px] text-amber-700">
                          Claimed by <b>{item.claimed_by_name}</b>. Enter their 4-digit pickup PIN to complete handover:
                        </div>
                        <div className="flex gap-2">
                          <input
                            type="text"
                            maxLength="4"
                            placeholder="e.g. 4821"
                            value={pinInput[item.id] || ''}
                            onChange={e => setPinInput({ ...pinInput, [item.id]: e.target.value })}
                            className="w-24 p-2 text-center font-mono font-bold bg-white border border-amber-300 rounded-lg text-sm"
                          />
                          <button
                            onClick={() => handleVerifyPin(item.id)}
                            className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow-sm"
                          >
                            Verify & Release
                          </button>
                        </div>
                        {pinError[item.id] && (
                          <div className="text-[11px] font-bold text-rose-600">{pinError[item.id]}</div>
                        )}
                      </div>
                    )}

                    {item.status === 'completed' && (
                      <div className="p-3 bg-slate-100 rounded-xl text-xs text-slate-600 font-bold flex items-center gap-2">
                        ✅ Handover Verified & Delivered to {item.claimed_by_name}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- 8. NGO DASHBOARD (src/pages/NgoDashboard.jsx) ---
    const NgoDashboard = () => {
      const { user } = useAuth();
      const [donations, setDonations] = useState([]);
      const [citizenReports, setCitizenReports] = useState([]);

      useEffect(() => {
        dbClient.getDonations().then(setDonations);
        dbClient.getCitizenReports().then(setCitizenReports);
      }, []);

      const handleClaim = async (id) => {
        await dbClient.claimDonation(id, user);
        dbClient.getDonations().then(setDonations);
      };

      const handleDispatch = async (id) => {
        await dbClient.dispatchReport(id, user.organization_name || user.full_name);
        dbClient.getCitizenReports().then(setCitizenReports);
      };

      const availableDonations = donations.filter(item => item.status === 'available');
      const myClaimedDonations = donations.filter(item => 
        item.claimed_by_id === user.id || 
        item.claimed_by_name === user.organization_name || 
        item.claimed_by_name === user.full_name ||
        (user.id === 'usr-ngo-102' && item.claimed_by_id === 'usr-ngo-102')
      );

      return (
        <div className="min-h-screen bg-slate-50 py-10 px-4 max-w-7xl mx-auto space-y-10">
          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-teal-600 bg-teal-50 px-3 py-1 rounded-full">
                🏢 NGO Rescue Command Center
              </span>
              <h1 className="text-3xl font-extrabold text-slate-900 mt-2">Welcome, {user?.full_name}</h1>
              <p className="text-slate-500 text-sm">{user?.organization_name || "Hope Shelter Dispatch Center"}</p>
            </div>
            <div className="bg-teal-50 border border-teal-100 p-4 rounded-2xl text-right">
              <div className="text-2xl font-black text-teal-800">{myClaimedDonations.length} Active</div>
              <div className="text-xs text-slate-600 font-bold">Claimed Rescue Missions</div>
            </div>
          </div>

          {/* INTERACTIVE LOGISTICS MAP */}
          <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-md space-y-4">
            <h2 className="text-xl font-extrabold text-slate-900">📍 Interactive Rescue Map</h2>
            <LiveRescueMap donations={donations} reports={citizenReports} height="360px" />
          </div>

          {/* MY CLAIMED PICKUPS & PINS */}
          {myClaimedDonations.length > 0 && (
            <div className="space-y-4">
              <h2 className="text-2xl font-extrabold text-slate-900 text-teal-800">🔒 My Claimed Rescue Missions & Pickup PINs</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {myClaimedDonations.map(item => (
                  <div key={item.id} className="bg-white p-6 rounded-2xl border-2 border-teal-500 shadow-md space-y-4">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-teal-700 bg-teal-50 px-2.5 py-1 rounded-full">{item.category}</span>
                      <span className="text-xs font-extrabold px-3 py-1 bg-amber-100 text-amber-800 rounded-full capitalize">Ready for Pickup</span>
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-900 text-lg">{item.title}</h3>
                      <div className="text-xs text-slate-600 mt-1">Donor: {item.donor_name} | Qty: {item.quantity}</div>
                      <div className="text-xs text-slate-500">📍 {item.address}</div>
                    </div>
                    <div className="p-4 bg-teal-50 border border-teal-200 rounded-xl space-y-2 text-center">
                      <div className="text-xs font-bold text-teal-800">Show this PIN to Donor Upon Arrival:</div>
                      <div className="text-3xl font-black tracking-widest text-teal-900 font-mono bg-white py-2 rounded-lg border border-teal-300">
                        {item.pickup_pin}
                      </div>
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=SFR-PIN-${item.pickup_pin}`}
                        alt="Pickup QR Code"
                        className="w-20 h-20 mx-auto rounded-md border border-slate-200 mt-2"
                      />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="space-y-4">
            <h2 className="text-2xl font-extrabold text-slate-900">Available Surplus Food Feed ({availableDonations.length})</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {availableDonations.map(item => (
                <div key={item.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-md space-y-4">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">{item.category}</span>
                    <span className="text-xs font-extrabold px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full capitalize">{item.status}</span>
                  </div>
                  <div>
                    <h3 className="font-bold text-slate-900 text-lg">{item.title}</h3>
                    <div className="text-xs text-slate-600 mt-1">Donor: {item.donor_name} | Qty: {item.quantity}</div>
                    <div className="text-xs text-slate-500">📍 {item.address}</div>
                  </div>
                  <button onClick={() => handleClaim(item.id)} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-colors">
                    Claim Food Donation
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="space-y-4 pt-6 border-t border-slate-200">
            <h2 className="text-2xl font-extrabold text-slate-900">Citizen Spotter Hunger Reports</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {citizenReports.map(report => (
                <div key={report.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-md space-y-2">
                  <h3 className="font-extrabold text-slate-900">{report.location}</h3>
                  <div className="text-xs text-slate-600">Est. People: ~{report.est_people} | Urgency: {report.urgency}</div>
                  <p className="text-xs text-slate-500 bg-slate-50 p-3 rounded-xl">{report.description}</p>
                  {report.status === 'pending' ? (
                    <button onClick={() => handleDispatch(report.id)} className="w-full py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl">
                      Dispatch Rescue Team
                    </button>
                  ) : (
                    <div className="text-xs text-emerald-700 font-bold">Dispatched by {report.serviced_by}</div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- 9. CITIZEN DASHBOARD (src/pages/CitizenDashboard.jsx) ---
    const CitizenDashboard = () => {
      const { user } = useAuth();
      const [reports, setReports] = useState([]);
      const [location, setLocation] = useState('');
      const [estPeople, setEstPeople] = useState('35');
      const [urgency, setUrgency] = useState('High');
      const [description, setDescription] = useState('');
      const [reportCoords, setReportCoords] = useState({ lat: 40.7306, lng: -73.9921 });

      useEffect(() => {
        dbClient.getCitizenReports().then(setReports);
      }, []);

      const handleReport = async (e) => {
        e.preventDefault();
        await dbClient.createCitizenReport({
          reporter_id: user.id,
          reporter_name: user.full_name,
          location: location || `Spotter Alert (${reportCoords.lat}, ${reportCoords.lng})`,
          est_people: parseInt(estPeople) || 10,
          urgency,
          description,
          lat: reportCoords.lat,
          lng: reportCoords.lng
        });
        setLocation('');
        setDescription('');
        dbClient.getCitizenReports().then(setReports);
      };

      // Filter reports submitted under this specific Citizen account
      const myReports = reports.filter(rep => 
        rep.reporter_id === user.id || 
        rep.reporter_name === user.full_name ||
        (user.id === 'usr-citizen-103' && (rep.reporter_id === 'usr-citizen-1' || rep.reporter_id === 'usr-citizen-103'))
      );

      return (
        <div className="min-h-screen bg-slate-50 py-10 px-4 max-w-7xl mx-auto space-y-8">
          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm border-l-8 border-amber-500">
            <h1 className="text-3xl font-extrabold text-slate-900">Citizen Spotter - Welcome, {user?.full_name}</h1>
          </div>

          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-md space-y-6">
            <h2 className="text-xl font-bold text-slate-900">Report Hunger Location</h2>
            <form onSubmit={handleReport} className="space-y-4">
              <input type="text" value={location} onChange={e => setLocation(e.target.value)} placeholder="Location Name / Address (e.g. 4th & Main Plaza)" className="w-full p-3.5 bg-slate-50 border rounded-xl" required />
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="number" value={estPeople} onChange={e => setEstPeople(e.target.value)} placeholder="Est People" className="p-3.5 bg-slate-50 border rounded-xl" required />
                <select value={urgency} onChange={e => setUrgency(e.target.value)} className="p-3.5 bg-slate-50 border rounded-xl">
                  <option value="Emergency">Emergency</option>
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                </select>
              </div>
              <textarea value={description} onChange={e => setDescription(e.target.value)} placeholder="Description & Notes" className="w-full p-3.5 bg-slate-50 border rounded-xl" rows="2" />

              {/* MAP INCIDENT LOCATION PICKER */}
              <LocationPickerMap
                initialLat={reportCoords.lat}
                initialLng={reportCoords.lng}
                onLocationSelect={setReportCoords}
                label="Pin Incident Spotter Location on Map"
                height="220px"
              />

              <button type="submit" className="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md transition-colors">
                Submit Hunger Alert
              </button>
            </form>
          </div>

          <div className="space-y-4">
            <h2 className="text-xl font-bold text-slate-900">My Submitted Spotter Alerts ({myReports.length})</h2>
            {myReports.length === 0 ? (
              <div className="bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center text-slate-500 font-semibold text-sm">
                You have not submitted any spotter alerts yet under this account. Report a hunger location above!
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {myReports.map(rep => (
                  <div key={rep.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                    <div className="flex justify-between">
                      <span className="text-xs font-bold text-amber-600">{rep.urgency} Urgency</span>
                      <span className="text-xs font-bold capitalize">{rep.status}</span>
                    </div>
                    <h3 className="font-bold text-slate-900">{rep.location}</h3>
                    <div className="text-xs text-slate-600">Est. People: ~{rep.est_people}</div>
                    <p className="text-xs text-slate-500">{rep.description}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- 10. MAIN APP ASSEMBLY ---
    const App = () => {
      return (
        <AuthProvider>
          <div className="min-h-screen flex flex-col bg-slate-50 font-sans relative">
            <Navbar />
            <main className="flex-grow">
              <Routes>
                <Route path="/" element={<GlobalImpactPage />} />
                <Route path="/login-donor" element={<LoginPage targetRole="donor" />} />
                <Route path="/login-ngo" element={<LoginPage targetRole="ngo" />} />
                <Route path="/login-citizen" element={<LoginPage targetRole="citizen" />} />
                <Route path="/donor" element={<ProtectedRoute allowedRole="donor"><DonorDashboard /></ProtectedRoute>} />
                <Route path="/ngo" element={<ProtectedRoute allowedRole="ngo"><NgoDashboard /></ProtectedRoute>} />
                <Route path="/citizen" element={<ProtectedRoute allowedRole="citizen"><CitizenDashboard /></ProtectedRoute>} />
              </Routes>
            </main>
            <FloatingDemoSwitcher />
          </div>
        </AuthProvider>
      );
    };

    // Render React App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(
      <HashRouter>
        <App />
      </HashRouter>
    );
  </script>
</body>

</html>
